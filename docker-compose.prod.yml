services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  web:
    image: ghcr.io/amratef0/schoolproject-app:latest
    container_name: schoolproject
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver

volumes:
  sqlserver_data:
